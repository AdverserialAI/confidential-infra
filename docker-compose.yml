# Confidential CyberGLM deployment template for a Phala 8×H200 Intel-TDX CVM.
#
# This file is a deployment contract, not a runnable default. Render it with
# scripts/prepare-deployment.sh after supplying sealed values and immutable
# image digests. Do not put keys, model weights, customer API keys, or the
# Gandi PAT in this repository or in a committed .env file.
#
# Trust boundary:
# - cc-chat.adverserial.ai is an external static browser app. It never proxies
#   prompts and is not a service in this compose file.
# - cc-api.adverserial.ai terminates TLS only in attest-proxy inside this CVM.
# - SGLang shares the proxy network namespace and listens only on 127.0.0.1.
# - Billing receives signed entitlement/meter metadata; it receives no prompt.
services:
  attest-proxy:
    # Must be a reviewed GitHub release image pinned by immutable digest, e.g.
    # ghcr.io/adverserialai/attest-proxy@sha256:<release-digest>
    image: ${ATTEST_PROXY_IMAGE:?set a pinned attest-proxy release image}
    restart: unless-stopped
    depends_on:
      model-measurer:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "65532:65532"
    ports:
      - "443:8443"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock:ro
      # Private proxy state. The image pre-creates /state as uid/gid 65532;
      # Docker initializes this named volume from that directory. It holds ACME
      # state, replay IDs, meter records, and the locally materialized mTLS
      # client bundle — never model weights, prompts, or GPU evidence.
      - proxy-state:/state
      # Collector output is a separate least-privilege volume. The proxy can
      # read signed GPU evidence but the collector cannot read proxy state.
      - gpu-evidence-state:/evidence:ro
      # The proxy receives only the signed manifest, never the model files.
      - model-evidence-state:/model-evidence:ro
    environment:
      LISTEN_ADDR: ":8443"
      UPSTREAM: "http://127.0.0.1:30000"
      UPSTREAM_BEARER_TOKEN: ${SGLANG_LOOPBACK_TOKEN:?sealed SGLang credential required}
      PUBLIC_BASE_URL: "https://cc-api.adverserial.ai"
      ENDPOINT: "https://cc-api.adverserial.ai"
      MODEL_ID: ${MODEL_ID:?canonical publisher/model ID required}
      ATTESTED_MODELS: ${MODEL_ID:?canonical publisher/model ID required}
      POLICY_ID: ${POLICY_ID:?published policy identifier required}
      COMPOSE_DIGEST: ${COMPOSE_DIGEST:?rendered compose digest required}
      # Written once by the isolated model-measurer before the proxy starts.
      MODEL_MANIFEST_FILE: ${MODEL_MANIFEST_FILE:?model artifact manifest path required}
      RUNTIME_DIGEST: ${RUNTIME_DIGEST:?attested runtime digest required}
      RECEIPT_ISSUER: "https://verify.adverserial.ai"
      RECEIPT_AUDIENCE: "https://cc-chat.adverserial.ai"
      VERIFICATION_URL: "https://verify.adverserial.ai"
      DSTACK_SOCKET: "/var/run/dstack.sock"
      ACME_DOMAINS: "cc-api.adverserial.ai"
      ACME_EMAIL: ${ACME_EMAIL:?ACME account contact required}
      GANDI_ZONE: "adverserial.ai"
      GANDI_PAT: ${GANDI_PAT:?sealed Gandi DNS token required}
      CERT_DIR: "/state/certificates"
      CORS_ALLOW_ORIGIN: "https://cc-chat.adverserial.ai"
      GPU_EVIDENCE_FILE: "/evidence/gpu-evidence.json"
      # Confidential authorization: normal platform keys stop at billing.
      AUTH_REQUIRED: "0"
      CONFIDENTIAL_MODE: "1"
      CONFIDENTIAL_ACTIVATION: ${CONFIDENTIAL_ACTIVATION:-pre-activation}
      # Meter records leave the CVM only through a dedicated TLS 1.3 mTLS
      # ingress. The proxy validates this ingress's CA and presents its own
      # sealed client key; direct delivery to Heroku billing is forbidden.
      METER_URL: ${METER_URL:?mTLS meter-ingress URL required}
      # A single sealed base64url JSON value; attest-proxy validates and
      # atomically writes it under /state/meter-tls with mode 0600.
      METER_TLS_BUNDLE_B64: ${METER_TLS_BUNDLE_B64:?sealed mTLS client bundle required}
      ENTITLEMENT_JWKS_JSON: ${ENTITLEMENT_JWKS_JSON:?billing entitlement public JWKS required}
      ENTITLEMENT_ISSUER: "https://billing.adverserial.ai"
      ENTITLEMENT_AUDIENCE: "https://cc-api.adverserial.ai"
      ENTITLEMENT_REPLAY_DIR: "/state/used-entitlements"
      METER_SIGNING_SEED: ${METER_SIGNING_SEED:?sealed proxy meter seed required}
      RECEIPT_SIGNING_SEED: ${RECEIPT_SIGNING_SEED:?sealed proxy receipt seed required}
      METER_ISSUER: "https://cc-api.adverserial.ai"
      METER_AUDIENCE: "https://billing.adverserial.ai"
      METER_OUTBOX_DIR: "/state/meter-outbox"

  # The measurer sees model weights read-only and writes a deterministic
  # manifest to a dedicated volume. It has no network, credentials, or API.
  model-measurer:
    image: ${MODEL_MEASURER_IMAGE:?set a pinned model-measurer release image}
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "65532:65532"
    volumes:
      - model-weights:/model:ro
      - model-evidence-state:/model-evidence
    environment:
      MODEL_ROOT: "/model${MODEL_ARTIFACT_PATH:?artifact path under /model required}"
      MODEL_MANIFEST_FILE: ${MODEL_MANIFEST_FILE:?model artifact manifest path required}
      MODEL_ID: ${MODEL_ID:?canonical publisher/model ID required}

  # The model has no public port and shares only attest-proxy's network
  # namespace. The proxy overwrites client Authorization with the sealed
  # loopback credential below; no client token reaches SGLang.
  sglang:
    image: ${SGLANG_IMAGE:?set a pinned SGLang runtime image}
    restart: unless-stopped
    network_mode: "service:attest-proxy"
    depends_on:
      - attest-proxy
    shm_size: 32gb
    volumes:
      - model-weights:/data:ro
    command: >
      python -m sglang.launch_server
      --model-path ${SGLANG_MODEL_PATH:?model path under /data required}
      --served-model-name ${MODEL_ID:?canonical publisher/model ID required}
      --host 127.0.0.1
      --port 30000
      --api-key ${SGLANG_LOOPBACK_TOKEN:?sealed SGLang credential required}
      --tp ${SGLANG_TP_SIZE:?tensor-parallel size required}
      --mem-fraction-static ${SGLANG_MEM_FRACTION:?memory fraction required}
      --context-length ${SGLANG_CONTEXT_LENGTH:?context length required}
      ${SGLANG_MODEL_OPTIONS:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              count: ${GPU_COUNT:?GPU count required}
              capabilities: [gpu]

  # A released collector image runs NVIDIA NRAS collection independently and
  # writes only signed GPU evidence into its dedicated evidence volume. It gets
  # GPU access but never receives model weights, prompts, proxy state, or
  # metering credentials.
  gpu-evidence-collector:
    image: ${GPU_EVIDENCE_COLLECTOR_IMAGE:?set a pinned collector release image}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    user: "65532:65532"
    volumes:
      - gpu-evidence-state:/evidence
    environment:
      GPU_EVIDENCE_OUT: "/evidence/gpu-evidence.json"
      GPU_EVIDENCE_INTERVAL: ${GPU_EVIDENCE_INTERVAL:-300}
      GPU_EVIDENCE_EXPECTED_TYPE: ${GPU_EVIDENCE_EXPECTED_TYPE:?policy evidence type required}
      GPU_EVIDENCE_MIN_GPU_COUNT: ${GPU_COUNT:?GPU count required}
      NV_ATTESTATION_SERVICE_KEY: ${NV_ATTESTATION_SERVICE_KEY:?sealed NVIDIA attestation service key required}
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              count: ${GPU_COUNT:?GPU count required}
              capabilities: [gpu]

volumes:
  model-weights:
    name: ${MODEL_WEIGHTS_VOLUME:?external model weight volume required}
    external: true
  # Docker initializes these private volumes from image-owned directories on
  # first boot. No out-of-band volume creation or secret injection is needed.
  proxy-state:
  gpu-evidence-state:
  # Written once by model-measurer; proxy reads the digest only.
  model-evidence-state:
