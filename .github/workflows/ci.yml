name: Validate templates
on: [push, pull_request]
permissions: {contents: read}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Reject shell trace logging
        run: "grep -R --exclude-dir=.git --exclude-dir=.github --line-number 'set -x' . && exit 1 || true"
      - name: Reject mutable container tags
        run: "grep -R --exclude-dir=.git --exclude-dir=.github --line-number 'image: .*:latest' docker-compose.yml && exit 1 || true"
      - name: Validate one-shot model backup definition
        run: |
          python3 -m py_compile backup/backup.py
          SGLANG_API_KEY=test-only HF_TOKEN=hf_test_only BACKUP_IMAGE=example.invalid/cyberglm-backup@sha256:$(printf '0%.0s' {1..64}) docker compose -f backup-compose.yml config --quiet
      - name: Validate fail-closed confidential deployment render
        run: bash scripts/test-prepare-deployment.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate native artifact and future serving boundaries
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/test-native-artifact-check.py
          python scripts/test-vllm-serving-preparation.py
          python scripts/test-vllm-stage-preparation.py
          python scripts/test-llama-context-update.py
          node --test scripts/test-vllm-stage-monitor.mjs
