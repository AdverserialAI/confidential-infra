# One-time private CyberGLM artifact backup. This is intentionally separate
# from the final confidential-inference compose: it preserves the currently
# recovered serving configuration and adds only a constrained uploader.
#
# Required sealed variables: SGLANG_API_KEY, HF_TOKEN.
# HF_TOKEN must have write access only to lordx64/cyberglm-fp8-abliterated.
services:
  serve:
    image: lmsysorg/sglang@sha256:2dbe4c7f53230b09aaa8fa41891c13c51d9d2e253f486a70822aaf08783fff75
    shm_size: 32gb
    restart: on-failure
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      SGLANG_API_KEY: ${SGLANG_API_KEY:?sealed SGLang API key required}
    privileged: true
    ports:
      - "30000:30000"
    volumes:
      - cyberglm-data:/data
    command: >
      bash -c 'nvidia-smi -L; exec python -m sglang.launch_server
      --model-path /data/cyberglm-fp8
      --served-model-name cyberglm --served-model-name lordx64/cyberglm
      --api-key $$SGLANG_API_KEY
      --host 0.0.0.0
      --port 30000
      --tp 8
      --trust-remote-code
      --kv-cache-dtype fp8_e4m3
      --dsa-prefill-backend flashmla_sparse_q8
      --dsa-decode-backend flashmla_kv
      --speculative-algorithm EAGLE
      --speculative-num-steps 5
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 6
      --mem-fraction-static 0.8
      --context-length 1048576
      --reasoning-parser glm45
      --tool-call-parser glm47'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8
              capabilities: [gpu]

  backup:
    # Immutable public GHCR manifest verified before this deployment.
    image: ghcr.io/adverserialai/cyberglm-backup@sha256:66cb575c96ae6df2662d4831114ae57b0a32742a52bacf2b84796d146c445804
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      - serve
    # dstack's Docker API exposes a 1-CPU create-time quota even on this
    # 128-vCPU CVM; do not set a Compose CPU limit here. Hashing remains capped
    # in-process at BACKUP_HASH_WORKERS=2 and this sidecar never receives a GPU.
    mem_limit: 8g
    volumes:
      # The model artifact itself is never writable by the uploader.
      - cyberglm-data:/data:ro
      - backup-state:/state
    environment:
      HF_TOKEN: ${HF_TOKEN:?sealed Hugging Face write token required}
      HF_REPO_ID: lordx64/cyberglm-fp8-abliterated
      BACKUP_SOURCE: /data/cyberglm-fp8
      BACKUP_STATE_DIR: /state
      BACKUP_HASH_WORKERS: "2"
      BACKUP_WAIT_FOR_URL: http://serve:30000/health
      BACKUP_WAIT_TIMEOUT_SECONDS: "21600"
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /state/huggingface-home

volumes:
  # Preserve the original Compose-managed model volume name exactly.
  cyberglm-data:
  backup-state:
